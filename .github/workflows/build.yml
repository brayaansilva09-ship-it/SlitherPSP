name: Build PSP ISO
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: pspdev/pspdev:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar bibliotecas e compilar ISO
        run: |
          psp-pacman -S --noconfirm sdl sdl-gfx
          apt-get update && apt-get install -y genisoimage
          make iso
      - name: Disponibilizar ISO para Download
        uses: actions/upload-artifact@v4
        with:
          name: SlitherPSP-ISO
          path: SlitherPSP.iso
